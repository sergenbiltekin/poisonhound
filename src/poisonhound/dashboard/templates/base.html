<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}PoisonHound{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">poisonhound<span class="dot">.</span></div>
    <nav>
      <a href="/" class="{% if active == 'alerts' %}active{% endif %}">Alerts</a>
      <a href="/settings" class="{% if active == 'settings' %}active{% endif %}">Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
