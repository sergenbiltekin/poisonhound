<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Log in - PoisonHound</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">poisonhound<span class="dot">.</span></div>

      {% if error %}
        <div class="banner banner-error">Incorrect username or password.</div>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}" />
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autofocus required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required />
        </div>
        <button class="primary" type="submit" style="width: 100%;">Log in</button>
      </form>
    </div>
  </div>
</body>
</html>
